name: GPU numerical validation (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cuda:
    runs-on: [self-hosted, linux, x64, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Check preinstalled matching CUDA stack
        run: |
          python -c "import torch,triton; assert torch.cuda.is_available(); print(torch.__version__,triton.__version__,torch.cuda.get_device_name())"
      - run: python -m pip install -e ".[test]"
      - run: pytest
